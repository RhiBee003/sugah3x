[package]
name = "sugarhex-rs"
version = "0.1.0"
edition = "2021"
description = "SugaH3x — alt gothic pink clothing shop (Rust)"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["fs", "set-header"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"

# Pin for Rust 1.83 (hyper-util >=0.1.17 needs edition2024 / newer cargo)
hyper-util = "=0.1.16"
