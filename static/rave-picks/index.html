<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SugaH3x rave outfits</title>
    <style>
      body {
        margin: 0;
        background: #141311;
        color: #f7ecef;
        font-family: "Helvetica Neue", sans-serif;
        padding: 1.2rem;
      }
      h1 {
        font-size: 1.2rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 1.2rem;
        margin-bottom: 2.5rem;
      }
      figure {
        margin: 0;
        background: #1c1b19;
        border: 1px solid rgba(243, 167, 188, 0.35);
        padding: 0.75rem;
      }
      img {
        width: 100%;
        height: auto;
        display: block;
      }
      figcaption {
        margin-top: 0.6rem;
        color: #f3a7bc;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <h1>Skimpy rave — pick by number</h1>
    <div class="grid">
      <figure>
        <img src="skimpy-01.jpg" alt="1 Pink bustier mini" />
        <figcaption>1 — Pink bustier + mini</figcaption>
      </figure>
      <figure>
        <img src="skimpy-02.jpg" alt="2 Bow crop vinyl shorts" />
        <figcaption>2 — Bow crop + vinyl shorts</figcaption>
      </figure>
      <figure>
        <img src="skimpy-03.jpg" alt="3 Patent mesh mini" />
        <figcaption>3 — Patent mesh mini</figcaption>
      </figure>
      <figure>
        <img src="skimpy-04.jpg" alt="4 Lace bow romper" />
        <figcaption>4 — Lace bow romper</figcaption>
      </figure>
      <figure>
        <img src="skimpy-05.jpg" alt="5 Velvet bustier shorts" />
        <figcaption>5 — Velvet bustier + shorts</figcaption>
      </figure>
      <figure>
        <img src="skimpy-06.jpg" alt="6 Harness patent set" />
        <figcaption>6 — Harness patent set</figcaption>
      </figure>
      <figure>
        <img src="skimpy-07.jpg" alt="7 Widow robe rave" />
        <figcaption>7 — Open robe rave</figcaption>
      </figure>
      <figure>
        <img src="skimpy-08.jpg" alt="8 Wrap crop mini" />
        <figcaption>8 — Wrap crop + mini</figcaption>
      </figure>
    </div>
  </body>
</html>
