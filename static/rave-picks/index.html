<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SugaH3x rave outfits</title>
    <style>
      body {
        margin: 0;
        background: #141311;
        color: #f7ecef;
        font-family: "Helvetica Neue", sans-serif;
        padding: 1.2rem;
      }
      h1 {
        font-size: 1.2rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 1.2rem;
      }
      figure {
        margin: 0;
        background: #1c1b19;
        border: 1px solid rgba(243, 167, 188, 0.35);
        padding: 0.75rem;
      }
      img {
        width: 100%;
        height: auto;
        display: block;
      }
      figcaption {
        margin-top: 0.6rem;
        color: #f3a7bc;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <h1>Rave outfits — pick by number</h1>
    <div class="grid">
      <figure>
        <img src="outfit-01.jpg" alt="1 Pink corset cargo rave" />
        <figcaption>1 — Mesh corset + bow cargos</figcaption>
      </figure>
      <figure>
        <img src="outfit-02.jpg" alt="2 Lace romper rave" />
        <figcaption>2 — Lace hem romper + veil</figcaption>
      </figure>
      <figure>
        <img src="outfit-03.jpg" alt="3 Chrome pink rave" />
        <figcaption>3 — Pink mesh + chrome cargo skirt</figcaption>
      </figure>
      <figure>
        <img src="outfit-04.jpg" alt="4 Cemetery picnic rave" />
        <figcaption>4 — Bow picnic + widow robe</figcaption>
      </figure>
      <figure>
        <img src="outfit-05.jpg" alt="5 Tee dress rave" />
        <figcaption>5 — Heart-cross tee dress + fishnets</figcaption>
      </figure>
      <figure>
        <img src="outfit-06.jpg" alt="6 Velvet bow rave" />
        <figcaption>6 — Velvet bow corset + socks</figcaption>
      </figure>
      <figure>
        <img src="outfit-07.jpg" alt="7 Patent ritual rave" />
        <figcaption>7 — Patent mesh ritual set</figcaption>
      </figure>
      <figure>
        <img src="outfit-08.jpg" alt="8 Afters slip rave" />
        <figcaption>8 — Blush slip afters look</figcaption>
      </figure>
    </div>
  </body>
</html>
